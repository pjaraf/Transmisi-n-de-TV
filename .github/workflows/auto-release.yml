name: Auto Build & Release APK

on:
  push:
    branches:
      - main
      - principal
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para crear la Release y subir el APK

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Version Tag
        id: version_tag
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName="${{ steps.version_tag.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_tag.outputs.tag }}
          name: Actualización Automática ${{ steps.version_tag.outputs.tag }}
          body: "Esta actualización fue generada automáticamente por GitHub Actions."
          files: app/build/outputs/apk/debug/app-debug.apk
